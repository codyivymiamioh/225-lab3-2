apiVersion: apps/v1
kind: Deployment
metadata:
  name: roseaw-dev-deployment
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: cithit/ivyca:latest  # Jenkins will replace "latest" with build-${BUILD_NUMBER}
        imagePullPolicy: Always
        ports:
        - containerPort: 80  # Expose NGINX on port 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-dev-service
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 32000

